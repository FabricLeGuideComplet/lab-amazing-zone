# Projet dbt d'Amazing Zone : couches Silver et Gold dans le Warehouse AmazingZoneWH, construites à partir
# du Bronze du Lakehouse AmazingZoneLK (un schéma par système source), lu par son point de terminaison SQL.
name: amazingzone
version: "1.0.0"
config-version: 2
profile: amazingzone

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

models:
  amazingzone:
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
    ml:
      +schema: ml
      +materialized: table
    api:
      +schema: api
      +materialized: table
    securite:
      +schema: securite
      +materialized: table

seeds:
  amazingzone:
    +schema: silver
    securite_entrepot:
      +schema: securite
      # Types explicites : sans --full-refresh, dbt vide la table du seed sans la recréer, et des types
      # inférés du contenu (longueur du plus long UPN) refuseraient un utilisateur au nom plus long.
      +column_types:
        utilisateur: varchar(256)
        code_entrepot: varchar(10)

snapshots:
  amazingzone:
    +target_schema: snapshots

# Sécurité au niveau des lignes et des colonnes du Warehouse (macros/securite.sql) : la politique, liée au
# schéma, est retirée avant la reconstruction des tables puis recréée avec les rôles et les droits.
on-run-start:
  - "{{ securite_retirer() }}"
on-run-end:
  - "{{ securite_fonction() }}"
  - "{{ securite_politique() }}"
  - "{{ securite_roles() }}"

vars:
  # Identités qui voient tous les entrepôts : le principal de service qui exécute dbt et l'équipe Data.
  securite_acces_complet: ["SP-Fabric-AmazingZone", "dp-equipedata"]
